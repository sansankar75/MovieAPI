spring.application.name=movieTicketBookingSystem

# ---- Server ----
server.port=8080

# ---- Database: your real PostgreSQL DB, not H2 ----
spring.datasource.url=jdbc:postgresql://localhost:5432/MovieAPI
spring.datasource.username=postgres
spring.datasource.password=sankarsan
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- HikariCP pool settings (Spring Boot uses Hikari by default automatically) ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ---- JPA / Hibernate ----
# update = adjusts the schema to match your entities WITHOUT deleting existing data.
# Never use create-drop here -- that wipes every table on every restart.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- Jackson (JSON mapping) ----
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.serialization.write-dates-as-timestamps=false